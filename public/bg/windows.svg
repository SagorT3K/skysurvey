<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05">
    <!-- left glassy panel -->
    <rect x="60" y="380" width="330" height="210" rx="16" fill="#ffffff" fill-opacity="0.025"/>
    <line x1="60" y1="428" x2="390" y2="428"/>
    <circle cx="86" cy="404" r="7"/>
    <line x1="110" y1="404" x2="220" y2="404"/>
    <!-- right glassy panel -->
    <rect x="1480" y="330" width="380" height="240" rx="16" fill="#ffffff" fill-opacity="0.03"/>
    <line x1="1480" y1="384" x2="1860" y2="384"/>
    <circle cx="1510" cy="357" r="8"/>
    <line x1="1540" y1="357" x2="1680" y2="357"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.05">
    <!-- left panel content rows -->
    <rect x="84" y="450" width="150" height="10" rx="5"/>
    <rect x="84" y="474" width="220" height="10" rx="5"/>
    <rect x="84" y="498" width="180" height="10" rx="5"/>
    <rect x="84" y="540" width="90" height="24" rx="12" fill-opacity="0.07"/>
    <!-- right panel content rows -->
    <rect x="1510" y="410" width="170" height="12" rx="6"/>
    <rect x="1510" y="438" width="260" height="12" rx="6"/>
    <rect x="1510" y="466" width="210" height="12" rx="6"/>
    <rect x="1510" y="516" width="110" height="28" rx="14" fill-opacity="0.08"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.06">
    <!-- floating sparkle dots -->
    <circle cx="250" cy="330" r="3"/><circle cx="420" cy="640" r="2.5"/><circle cx="130" cy="700" r="2"/>
    <circle cx="1560" cy="660" r="3"/><circle cx="1840" cy="280" r="2.5"/><circle cx="1700" cy="700" r="2"/>
    <circle cx="960" cy="200" r="2"/><circle cx="620" cy="160" r="2.5"/>
  </g>
</svg>
