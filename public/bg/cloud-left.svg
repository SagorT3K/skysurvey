<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4fb" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#b9bfd4" stop-opacity=".78"/>
      <stop offset="1" stop-color="#646b88" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3f0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#565d7a" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <!-- big cluster, left edge, upper-middle -->
  <g fill="url(#c1)">
    <circle cx="60" cy="210" r="62"/>
    <circle cx="128" cy="172" r="76"/>
    <circle cx="205" cy="200" r="58"/>
    <ellipse cx="132" cy="236" rx="132" ry="40"/>
  </g>
  <ellipse cx="112" cy="152" rx="34" ry="14" fill="#ffffff" opacity=".55"/>
  <!-- small cloud below it -->
  <g fill="url(#c2)">
    <circle cx="90" cy="430" r="40"/>
    <circle cx="140" cy="412" r="48"/>
    <circle cx="185" cy="436" r="36"/>
    <ellipse cx="135" cy="452" rx="86" ry="24"/>
  </g>
  <ellipse cx="128" cy="398" rx="20" ry="8" fill="#ffffff" opacity=".4"/>
  <!-- tiny distant cloud, top-right of file -->
  <g fill="url(#c2)" opacity=".7">
    <circle cx="520" cy="80" r="30"/>
    <circle cx="560" cy="66" r="36"/>
    <ellipse cx="540" cy="92" rx="62" ry="17"/>
  </g>
</svg>
