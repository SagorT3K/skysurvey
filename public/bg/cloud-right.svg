<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="r1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4fb" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#b9bfd4" stop-opacity=".78"/>
      <stop offset="1" stop-color="#646b88" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3f0" stop-opacity=".78"/>
      <stop offset="1" stop-color="#565d7a" stop-opacity=".42"/>
    </linearGradient>
  </defs>
  <!-- big cluster, right edge, middle -->
  <g fill="url(#r1)">
    <circle cx="560" cy="260" r="66"/>
    <circle cx="490" cy="222" r="80"/>
    <circle cx="420" cy="256" r="54"/>
    <ellipse cx="492" cy="292" rx="138" ry="38"/>
  </g>
  <ellipse cx="508" cy="198" rx="36" ry="14" fill="#ffffff" opacity=".55"/>
  <!-- cluster bottom-right -->
  <g fill="url(#r2)">
    <circle cx="540" cy="520" r="42"/>
    <circle cx="486" cy="500" r="52"/>
    <circle cx="440" cy="528" r="36"/>
    <ellipse cx="490" cy="544" rx="94" ry="24"/>
  </g>
  <ellipse cx="474" cy="486" rx="20" ry="8" fill="#ffffff" opacity=".4"/>
  <!-- small cloud top-right -->
  <g fill="url(#r2)" opacity=".8">
    <circle cx="80" cy="70" r="30"/>
    <circle cx="126" cy="54" r="38"/>
    <ellipse cx="104" cy="80" rx="62" ry="17"/>
  </g>
</svg>
